services:
  - type: web
    name: gstprep-ai-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: XAI_API_KEY
        sync: false
      - key: GROK_MODEL
        value: grok-2-latest
      - key: XAI_BASE_URL
        value: https://api.x.ai/v1
      - key: CLIENT_URL
        sync: false
      - key: MAX_UPLOAD_MB
        value: 15
